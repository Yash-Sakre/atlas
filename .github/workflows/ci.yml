name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Also builds @codebase-atlas/schema (root postinstall).
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build schema, dashboard & CLI
        run: npm run build

      - name: Test
        run: npm test

      - name: Smoke test the CLI
        run: node packages/cli/dist/index.js analyze packages/cli/examples/sample-app --no-cache

      - name: Check the npm tarball
        run: npm pack --dry-run -w codebase-atlas

      - name: Build site
        run: npm run build:site

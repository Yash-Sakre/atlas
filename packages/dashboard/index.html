<!doctype html>
<html lang="en" data-theme="dark" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/atlas-mark.svg" />
    <title>Atlas</title>
    <script>
      // Stamp the saved theme before first paint so there's no flash of the
      // wrong mode. ThemeProvider takes over once React mounts.
      (function () {
        try {
          var m = localStorage.getItem('atlas:theme') || 'dark';
          if (m === 'system') m = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          var r = document.documentElement;
          r.dataset.theme = m;
          r.classList.toggle('dark', m === 'dark');
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

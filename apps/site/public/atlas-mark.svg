  <rect x="1.25" y="1.25" width="61.5" height="61.5" rx="12.75" stroke="url(#rim)" stroke-width="2.5"/>
  <g transform="translate(13 13) scale(0.6)">
    <path d="M25 6h11.5L19.5 58H5.5z" fill="url(#grad)"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="512" height="512" role="img" aria-label="Atlas" fill="none">
  <!-- Atlas app icon: the folded "A" on a glossy black tile with a polished rim.
       Keep in step with components/landing/AtlasMark.tsx (variant="tile"). -->
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#4ea8ff"/>
      <stop offset="0.55" stop-color="#a58bff"/>
      <stop offset="1" stop-color="#ff7aa8"/>
    </linearGradient>
    <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1c1e"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.3" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.06"/>
